name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      # Testcontainers(jdbc:tc) が Docker を使うため
      - name: Verify Docker is available
        run: docker version

      - name: Run tests
        env:
          SPRING_PROFILES_ACTIVE: test
        run: mvn -B test
